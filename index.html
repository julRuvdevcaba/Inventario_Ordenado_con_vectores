<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario por Vectores</title>

    <script src="./js/inventario.js"></script>
    <script src="./js/producto.js"></script>
</head>

<body>

    <div id="app">

        <form>

            <label for="txtCod">Código:</label>
            <input type="number" id="txtCod">

            <label for="txtNombre">Nombre:</label>
            <input type="text" id="txtNombre">

            <label for="txtCantidad">Cantidad:</label>
            <input type="number" id="txtCantidad">

            <label for="txtPrecio">Precio:</label>
            <input type="number" id="txtPrecio">

            <button type="button" id="btnAdd">Agregar</button>
            <button type="button" id="btnBuscar">Buscar</button>
            <button type="button" id="btnEliminar">Eliminar</button>
            <button type="button" id="btnListar">Listar</button>
            <button type="button" id="btnListarInverso">Listar inverso</button>
            <button type="button" id="btnExtraerPrimero">Extraer primero</button>
            <button type="button" id="btnExtraerUltimo">Extraer último</button>
            <button type="reset" id="btnCancelar">Cancelar</button>

        </form>

        <div id="detalles"></div>

    </div>

    <script src="./js/app.js"></script>

</body>
</html>
